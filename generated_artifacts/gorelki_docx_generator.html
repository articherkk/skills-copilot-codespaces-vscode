const S=[
['ВВЕДЕНИЕ',['Народные игры являются значимой частью культурного наследия любого народа. Они складывались на протяжении многих поколений, передавались от старших к младшим и сохранялись благодаря тому, что не требовали сложной подготовки или специального оборудования. В таких играх отражались образ жизни людей, особенности общения, представления о ловкости, смелости, честности и взаимоуважении.','Народная игра не сводится только к развлечению. Она помогает человеку развиваться физически, учит взаимодействовать с окружающими и принимать решения в постоянно меняющейся ситуации. В процессе игры участник должен соблюдать правила, контролировать эмоции, быстро реагировать на действия других людей и учитывать интересы коллектива.','Для данного реферата выбрана русская народная игра «Горелки». Это подвижная игра, основой которой являются бег, внимание и быстрота реакции. Участники становятся парами друг за другом, а один игрок — «горящий» — располагается впереди колонны. После произнесения считалки последняя пара разбегается в разные стороны и пытается соединиться впереди ведущего. Задача «горящего» — поймать одного из бегущих.','Цель работы — рассмотреть игру «Горелки», раскрыть её происхождение, национальную принадлежность, основные правила и значение для физического и нравственного воспитания.']],
['1. НАРОДНЫЕ ИГРЫ КАК ЧАСТЬ ТРАДИЦИОННОЙ КУЛЬТУРЫ',['Народная игра представляет собой форму совместной деятельности, которая складывается естественным образом и передаётся из поколения в поколение. В отличие от официальных спортивных дисциплин, она обычно не имеет единственного автора и строго зафиксированной даты появления.','В прошлом народные игры были важной частью повседневной жизни. В них играли во дворах, на сельских улицах, лугах, площадях и во время праздников. Они позволяли детям и молодёжи проводить свободное время активно и осваивать навыки, необходимые в реальной жизни.','Особое значение имели подвижные игры. Они включали бег, прыжки, метание, уклонение, преследование и другие движения. Такие занятия укрепляли здоровье и помогали развивать физические качества без однообразного повторения упражнений.','«Горелки» относятся к играм с преследованием. Их особенность состоит в том, что участники заранее располагаются парами, а затем по сигналу двое игроков начинают движение. Один стремится догнать, а другие — сохранить свою пару или образовать новую.']],
['2. ПРОИСХОЖДЕНИЕ И РАСПРОСТРАНЕНИЕ ИГРЫ «ГОРЕЛКИ»',['«Горелки» относятся к старинным русским народным подвижным играм. Точную дату их появления установить невозможно, поскольку правила долгое время передавались устно. Старшие участники показывали игру младшим, а те затем обучали следующее поколение.','Название игры связано со словом «гореть». Игрок, который стоит перед колонной и пытается поймать одного из бегущих, называется «горящим» или «горельщиком».','«Горелки» были распространены среди детей, подростков и молодёжи. Для игры не требовался специальный инвентарь, поэтому она подходила для разных условий: улицы, луга или просторной площадки.','Со временем описания народных игр стали включаться в этнографические сборники и педагогические пособия. Педагоги отмечали, что «Горелки» помогают развивать скорость, реакцию и внимание.']],
['3. НАЦИОНАЛЬНАЯ ПРИНАДЛЕЖНОСТЬ И КУЛЬТУРНОЕ ЗНАЧЕНИЕ ИГРЫ',['«Горелки» традиционно относятся к русским народным играм. Они получили широкое распространение в русской культурной среде и упоминаются в сборниках народных игр.','Национальная принадлежность проявляется не только в названии, но и в сопровождающем тексте. Перед началом бега участники произносят приговорку: «Гори, гори ясно, чтобы не погасло. Стой подоле, гляди на поле. Погляди на небо: звёзды горят, журавли кричат. Раз, два, не воронь, а беги, как огонь!»','Культурное значение «Горелок» заключается в соединении слова и движения. Участники включаются в игровую ситуацию с традиционным текстом, устойчивыми ролями и эмоциональным напряжением.','Игра помогает сохранять интерес к национальным традициям и может сопровождаться рассказом о народных праздниках и старинных формах совместного отдыха.']],
['4. ОПИСАНИЕ ИГРЫ: УЧАСТНИКИ, ПЛОЩАДКА И ОРГАНИЗАЦИЯ',['Для проведения классического варианта требуется группа участников. Желательно, чтобы количество игроков позволяло образовать несколько пар и выбрать одного ведущего. Например, при участии пятнадцати человек семь пар становятся в колонну, а один человек выполняет роль «горящего».','Игроки встают парами друг за другом. Каждая пара располагается на небольшом расстоянии от предыдущей. Впереди колонны, на расстоянии нескольких шагов, стоит «горящий».','Для игры выбирают ровную открытую площадку. На ней не должно быть ям, камней, скользких участков, посторонних предметов и препятствий.','Специальный инвентарь в классическом варианте не требуется. При необходимости можно использовать конусы, флажки или линии разметки, чтобы обозначить безопасные границы.']],
['5. ОСНОВНЫЕ ПРАВИЛА ИГРЫ «ГОРЕЛКИ»',['Перед началом игры выбирают «горящего». Это можно сделать с помощью считалки или жеребьёвки. Остальные участники образуют пары и становятся друг за другом.','После завершения приговорки последняя пара разъединяет руки. Один игрок бежит вперёд по левой стороне колонны, другой — по правой. Их задача — снова соединиться впереди «горящего».','Ведущий старается поймать одного из бегущих. Он должен действовать только после установленного сигнала. Нельзя начинать движение раньше времени или намеренно мешать участникам безопасно разбежаться.','Если «горящий» успевает поймать одного из игроков до того, как бегущие соединят руки, он образует пару с пойманным участником. Игрок, оставшийся без пары, становится новым «горящим».','Если бегущие успевают соединить руки раньше, чем ведущий поймает одного из них, они становятся первой парой в колонне, а «горящий» сохраняет свою роль.','Игра продолжается до установленного времени или до тех пор, пока участники сохраняют интерес и могут соблюдать безопасный темп.']],
['6. РАЗНОВИДНОСТИ ИГРЫ',['Правила «Горелок» могут адаптироваться к условиям проведения, возрасту и количеству участников. Наиболее распространён классический вариант: последняя пара разбегается по обе стороны колонны, а ведущий пытается поймать одного игрока.','Существует вариант с платком. Один из участников держит платок или другой небольшой предмет. В зависимости от договорённости задача может состоять в том, чтобы первым схватить платок или донести его до установленной линии.','В упрощённом варианте для младших детей сокращают дистанцию и разрешают ведущему ловить бегущего лёгким касанием руки.','Если участников много, группу лучше разделить на две части и организовать игру на двух площадках. Это позволяет каждому участнику чаще включаться в активное движение.']],
['7. ИСПОЛЬЗОВАНИЕ ИГРЫ НА ЗАНЯТИЯХ ФИЗИЧЕСКОЙ КУЛЬТУРОЙ',['«Горелки» могут применяться на уроках физической культуры как часть разминки, основной части занятия или спортивного праздника. Выбор зависит от цели преподавателя и возраста учеников.','Перед интенсивным бегом необходимо провести обычную разминку: лёгкий бег, упражнения для суставов и подготовку мышц ног.','В основной части занятия «Горелки» подходят для развития скорости и реакции. Преподаватель может обратить внимание на технику ускорения, положение тела во время бега и умение быстро менять направление.','Игра подходит и для внеурочной деятельности: школьных праздников, дней здоровья, летних лагерей и семейных мероприятий.']],
['8. ВОСПИТАТЕЛЬНОЕ И ОЗДОРОВИТЕЛЬНОЕ ЗНАЧЕНИЕ ИГРЫ',['«Горелки» развивают быстроту. Во время каждого забега участники должны резко ускориться, преодолеть небольшую дистанцию и успеть соединиться с партнёром.','Игра тренирует координацию движений. Бегущие движутся с разных сторон колонны и должны выбрать безопасную траекторию, учитывать положение ведущего и вовремя соединить руки.','Большое значение имеет внимание. Участники слушают приговорку и ждут сигнала. Последняя пара должна вовремя начать движение, а ведущий — быстро оценить ситуацию.','Игра формирует волевые качества и культуру общения. Участнику приходится действовать решительно, спокойно воспринимать неудачу и взаимодействовать с разными людьми.']],
['9. ТРЕБОВАНИЯ БЕЗОПАСНОСТИ',['Перед проведением игры необходимо осмотреть площадку. На ней не должно быть камней, веток, ям, скользких участков и других препятствий.','Участники должны быть в удобной одежде и спортивной обуви. Перед активным бегом проводится разминка. Следует заранее установить границы игровой зоны.','Запрещается толкаться, подставлять ноги, резко хватать других игроков за одежду или применять силу. Ведущий ловит бегущего лёгким касанием руки.','Организатор следит за тем, чтобы дети не начинали движение раньше сигнала. Нагрузка должна соответствовать возрасту и состоянию здоровья участников.']],
